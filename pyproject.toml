[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finrisk-agent"
version = "0.3.4"
description = "Evidence-grounded hybrid corporate financial risk assessment"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8",
  "PyYAML>=6", "PyMuPDF>=1.24", "python-multipart>=0.0.9",
  "reportlab>=4.2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
# E4-R is an offline retrospective study. Its tabular baselines need a numeric stack the
# product runtime deliberately does not ship, so it is an optional extra: the shipped
# service keeps a minimal dependency surface and E4-R stays reproducible on demand.
research = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `backend` is the product runtime. The remaining entries are standalone research modules
# (the E4-S audit, the E5 protocol and the E4-R robustness study), so declaring them here
# lets the tests import them normally instead of mutating `sys.path` after the import
# block (which ruff flags).
pythonpath = [
  "backend",
  "research/e4_statistical_audit",
  "research/e5/protocol",
  "research/e5/harness",
  "research/e4r_automated_robustness",
]
addopts = "-q"
markers = [
  "slow: statistical calibration studies that run many simulated replicates",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
# E4 modules are offline, frozen-study tooling rather than shipped API/Agent
# runtime. Their contracts are exercised by the dedicated E4 tests and public
# artifact verifier; the 90% gate continues to measure the product runtime.
omit = ["backend/finrisk/e4_*.py"]

[tool.ruff.lint.per-file-ignores]
"backend/finrisk/sec_bulk.py" = ["F401"]
