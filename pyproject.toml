[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finrisk-agent"
version = "0.3.2"
description = "Evidence-grounded hybrid corporate financial risk assessment"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8",
  "PyYAML>=6", "PyMuPDF>=1.24", "python-multipart>=0.0.9",
  "reportlab>=4.2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff.lint.per-file-ignores]
"backend/finrisk/sec_bulk.py" = ["F401"]
