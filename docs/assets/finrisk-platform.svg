<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">FinRisk enterprise financial risk intelligence</title>
  <desc id="desc">Evidence flows through deterministic finance and constrained semantic interpretation into auditable decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102c3a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d0ba"/><stop offset="1" stop-color="#75a9ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1440" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1240" cy="60" r="240" fill="#39d0ba" opacity=".05"/><circle cx="1320" cy="490" r="250" fill="#75a9ff" opacity=".05"/>
  <g transform="translate(78 76)">
    <rect width="62" height="62" rx="16" fill="url(#accent)"/>
    <path d="M17 39h8V24h8v15h8V17h8v30H17z" fill="#071525"/>
    <text x="82" y="44" fill="#f5fbff" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="700">FinRisk</text>
    <text x="0" y="126" fill="#f5fbff" font-family="Inter,Segoe UI,sans-serif" font-size="52" font-weight="700">Financial risk decisions,</text>
    <text x="0" y="187" fill="url(#accent)" font-family="Inter,Segoe UI,sans-serif" font-size="52" font-weight="700">grounded in evidence.</text>
    <text x="0" y="235" fill="#a8bdc9" font-family="Inter,Segoe UI,sans-serif" font-size="20">Deterministic finance · constrained LLM semantics · auditable decision paths</text>
    <g transform="translate(0 280)" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="600">
      <rect width="166" height="42" rx="21" fill="#39d0ba" opacity=".14" stroke="#39d0ba"/><text x="22" y="27" fill="#79ead9">EVIDENCE FIRST</text>
      <rect x="182" width="166" height="42" rx="21" fill="#75a9ff" opacity=".14" stroke="#75a9ff"/><text x="207" y="27" fill="#a8c7ff">FAILURE AWARE</text>
      <rect x="364" width="130" height="42" rx="21" fill="#f0a36b" opacity=".14" stroke="#f0a36b"/><text x="389" y="27" fill="#ffc49a">REPLAYABLE</text>
    </g>
  </g>
  <g transform="translate(850 76)" filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <rect width="500" height="368" rx="22" fill="#0d2131" stroke="#294355"/>
    <text x="30" y="44" fill="#829aaa" font-size="13" font-weight="700" letter-spacing="2">DECISION CONTRACT</text>
    <g transform="translate(30 70)">
      <rect width="440" height="60" rx="12" fill="#122c3d"/><circle cx="30" cy="30" r="11" fill="#39d0ba"/><text x="54" y="25" fill="#f5fbff" font-size="16" font-weight="600">Evidence coverage</text><text x="54" y="44" fill="#829aaa" font-size="13">source, page, span, status</text><text x="387" y="36" fill="#79ead9" font-size="18" font-weight="700">0.86</text>
      <rect y="76" width="440" height="60" rx="12" fill="#122c3d"/><circle cx="30" cy="106" r="11" fill="#75a9ff"/><text x="54" y="101" fill="#f5fbff" font-size="16" font-weight="600">Decision confidence</text><text x="54" y="120" fill="#829aaa" font-size="13">quality, agreement, freshness</text><text x="387" y="112" fill="#a8c7ff" font-size="18" font-weight="700">0.72</text>
      <rect y="152" width="440" height="60" rx="12" fill="#122c3d"/><circle cx="30" cy="182" r="11" fill="#f0a36b"/><text x="54" y="177" fill="#f5fbff" font-size="16" font-weight="600">Model disagreement</text><text x="54" y="196" fill="#829aaa" font-size="13">rules, models, narrative tension</text><text x="371" y="188" fill="#ffc49a" font-size="18" font-weight="700">HIGH</text>
      <rect y="228" width="440" height="64" rx="12" fill="#39271f" stroke="#f0a36b"/><text x="24" y="254" fill="#ffc49a" font-size="13" font-weight="700" letter-spacing="1.5">DECISION</text><text x="24" y="279" fill="#fff" font-size="21" font-weight="700">REVIEW REQUIRED</text><text x="342" y="269" fill="#ffc49a" font-size="14">RISK ≠ PROBABILITY</text>
    </g>
  </g>
</svg>
