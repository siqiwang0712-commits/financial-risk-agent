<title id="title">FinRisk hybrid architecture</title><rect width="1200" height="620" rx="20" fill="#f6f3eb"/><style>.h{font:700 20px Arial;fill:#16382e}.t{font:14px Arial;fill:#41554e}.box{fill:#fff;stroke:#83a598;stroke-width:2}.det{fill:#e4efe9;stroke:#477765;stroke-width:2}.llm{fill:#fff0eb;stroke:#d45b3e;stroke-width:2}.arrow{stroke:#536c63;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#536c63"/></marker></defs>
<text x="60" y="58" class="h" font-size="28">Hybrid reasoning architecture</text><text x="60" y="84" class="t">Language understanding proposes evidence; deterministic components own numbers, rules, scoring and admission.</text>
<g transform="translate(55 125)"><rect class="box" width="180" height="86" rx="12"/><text x="90" y="35" text-anchor="middle" class="h">Financial reports</text><text x="90" y="61" text-anchor="middle" class="t">10-K · 20-F · Annual</text></g>
<path class="arrow" d="M235 168h55"/><g transform="translate(290 125)"><rect class="det" width="180" height="86" rx="12"/><text x="90" y="35" text-anchor="middle" class="h">Page-aware parser</text><text x="90" y="61" text-anchor="middle" class="t">year · unit · currency</text></g>
<path class="arrow" d="M470 168h55"/><g transform="translate(525 125)"><rect class="det" width="180" height="86" rx="12"/><text x="90" y="35" text-anchor="middle" class="h">Structured values</text><text x="90" y="61" text-anchor="middle" class="t">provenance + confidence</text></g>
<path class="arrow" d="M705 168h55"/><g transform="translate(760 125)"><rect class="det" width="180" height="86" rx="12"/><text x="90" y="35" text-anchor="middle" class="h">Metrics engine</text><text x="90" y="61" text-anchor="middle" class="t">ratios · trends · N/A</text></g>
<path class="arrow" d="M940 168h55"/><g transform="translate(995 125)"><rect class="det" width="150" height="86" rx="12"/><text x="75" y="35" text-anchor="middle" class="h">4 models</text><text x="75" y="61" text-anchor="middle" class="t">applicability gated</text></g>
<g transform="translate(290 290)"><rect class="llm" width="180" height="86" rx="12"/><text x="90" y="35" text-anchor="middle" class="h">Narrative agent</text><text x="90" y="61" text-anchor="middle" class="t">structured candidates</text></g><path class="arrow" d="M145 211v122h145"/>
<g transform="translate(525 290)"><rect class="box" width="180" height="86" rx="12"/><text x="90" y="35" text-anchor="middle" class="h">Evidence verifier</text><text x="90" y="61" text-anchor="middle" class="t">quote + page admission</text></g><path class="arrow" d="M470 333h55"/>
<g transform="translate(760 290)"><rect class="det" width="180" height="86" rx="12"/><text x="90" y="35" text-anchor="middle" class="h">Rule engine</text><text x="90" y="61" text-anchor="middle" class="t">68 versioned signals</text></g><path class="arrow" d="M705 333h55"/><path class="arrow" d="M850 211v79"/>
