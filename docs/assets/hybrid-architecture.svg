<g transform="translate(410 465)"><rect class="det" width="220" height="92" rx="12"/><text x="110" y="35" text-anchor="middle" class="h">Risk aggregation</text><text x="110" y="62" text-anchor="middle" class="t">8 dimensions · family caps</text></g><path class="arrow" d="M850 376v70H630"/><path class="arrow" d="M1070 376v95H630"/>
