<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title"><title id="title">Evidence trace from conclusion to source page</title><rect width="1200" height="360" rx="20" fill="#102820"/><style>.b{fill:#173d31;stroke:#83a598;stroke-width:2}.a{stroke:#ee7455;stroke-width:3;fill:none;marker-end:url(#m)}.h{font:700 18px Arial;fill:#fff}.t{font:14px Arial;fill:#bcd0c8}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#ee7455"/></marker></defs><text x="55" y="58" class="h" font-size="27">Every important conclusion has a route back to evidence</text>
<g transform="translate(55 120)"><rect class="b" width="190" height="110" rx="12"/><text x="95" y="39" text-anchor="middle" class="h">Conclusion</text><text x="95" y="70" text-anchor="middle" class="t">Liquidity: High</text></g><path class="a" d="M245 175h45"/>
<g transform="translate(290 120)"><rect class="b" width="190" height="110" rx="12"/><text x="95" y="39" text-anchor="middle" class="h">Signal</text><text x="95" y="70" text-anchor="middle" class="t">LIQ_007</text></g><path class="a" d="M480 175h45"/>
<g transform="translate(525 120)"><rect class="b" width="190" height="110" rx="12"/><text x="95" y="39" text-anchor="middle" class="h">Derived metrics</text><text x="95" y="68" text-anchor="middle" class="t">Current ratio 0.83</text><text x="95" y="89" text-anchor="middle" class="t">Debt growth +73%</text></g><path class="a" d="M715 175h45"/>
<g transform="translate(760 120)"><rect class="b" width="190" height="110" rx="12"/><text x="95" y="39" text-anchor="middle" class="h">Financial values</text><text x="95" y="68" text-anchor="middle" class="t">value · year · unit</text><text x="95" y="89" text-anchor="middle" class="t">located / verified</text></g><path class="a" d="M950 175h45"/>
<g transform="translate(995 120)"><rect width="150" height="110" rx="12" fill="#ee7455"/><text x="75" y="39" text-anchor="middle" class="h">Report page</text><text x="75" y="70" text-anchor="middle" class="h">p. 86</text></g><text x="55" y="290" class="t">Missing inputs remain N/A. Conflicting candidates are held for review. A risk signal is never presented as proof of fraud.</text></svg>
