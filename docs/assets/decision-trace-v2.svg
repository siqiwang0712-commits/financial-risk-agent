<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">Auditable decision trace</title><desc id="desc">Every material decision is linked back to evidence with verification and failure-aware gates.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102c3a"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#678396"/></marker></defs>
  <rect width="1440" height="430" rx="24" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="60" y="58" fill="#f5fbff" font-size="29" font-weight="700">No material conclusion without a valid evidence path</text>
    <text x="60" y="88" fill="#91a9b8" font-size="16">Each edge carries provenance, verification status, version and contribution.</text>
    <g transform="translate(48 140)">
      <g fill="#102c3d" stroke="#2e5064"><rect width="190" height="102" rx="14"/><rect x="226" width="190" height="102" rx="14"/><rect x="452" width="190" height="102" rx="14"/><rect x="678" width="190" height="102" rx="14"/><rect x="904" width="190" height="102" rx="14"/><rect x="1130" width="214" height="102" rx="14" fill="#34271f" stroke="#d88b58"/></g>
      <g fill="#79ead9" font-size="12" font-weight="700" letter-spacing="1.2"><text x="18" y="28">SOURCE</text><text x="244" y="28">RAW EVIDENCE</text><text x="470" y="28">FACT / CLAIM</text><text x="696" y="28">TOOL RESULT</text><text x="922" y="28">FUSION</text><text x="1148" y="28" fill="#ffc49a">DECISION</text></g>
      <g fill="#f5fbff" font-size="17" font-weight="600"><text x="18" y="57">10-K / XBRL</text><text x="244" y="57">page · span</text><text x="470" y="57">normalized value</text><text x="696" y="57">metric · rule</text><text x="922" y="57">contribution</text><text x="1148" y="57">REVIEW</text></g>
      <g fill="#91a9b8" font-size="13"><text x="18" y="80">hash · accession</text><text x="244" y="80">quote · concept</text><text x="470" y="80">period · unit</text><text x="696" y="80">model · version</text><text x="922" y="80">coverage · conflict</text><text x="1148" y="80">reason code · owner</text></g>
      <g stroke="#678396" stroke-width="2" marker-end="url(#a)"><path d="M194 51h25"/><path d="M420 51h25"/><path d="M646 51h25"/><path d="M872 51h25"/><path d="M1098 51h25"/></g>
    </g>
    <g transform="translate(60 292)">
      <rect width="1320" height="80" rx="14" fill="#111f2b" stroke="#294355"/>
      <text x="24" y="31" fill="#ffc49a" font-size="13" font-weight="700" letter-spacing="1.3">FAILURE-AWARE GATES</text>
      <text x="24" y="57" fill="#c5d4dc" font-size="15">missing evidence → lower coverage   ·   conflict → disagreement   ·   stale/parser/LLM failure → REVIEW or ABSTAIN   ·   failed verification → reject claim</text>
    </g>
  </g>
</svg>
