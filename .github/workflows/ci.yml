name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finrisk_test
          POSTGRES_USER: finrisk
          POSTGRES_PASSWORD: finrisk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finrisk -d finrisk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://finrisk:finrisk_test@localhost:5432/finrisk_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev,postgres]"
      - run: ruff check backend tests scripts
      - run: python scripts/validate_postgres_migration.py
      - run: pytest --cov=finrisk --cov-report=term-missing --cov-fail-under=90
      - name: Reproduce the checked-in public benchmark
        run: |
          python scripts/run_public_benchmark.py
          git diff --exit-code -- research/results/public_v1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
