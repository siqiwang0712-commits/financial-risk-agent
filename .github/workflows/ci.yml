name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check backend tests scripts
      - run: pytest --cov=finrisk --cov-report=term-missing --cov-fail-under=90
      - name: Reproduce the checked-in public benchmark
        run: |
          python scripts/run_public_benchmark.py
          git diff --exit-code -- research/results/public_v1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
