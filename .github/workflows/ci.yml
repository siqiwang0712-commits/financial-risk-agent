name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finrisk_test
          POSTGRES_USER: finrisk
          POSTGRES_PASSWORD: finrisk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finrisk -d finrisk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://finrisk:finrisk_test@localhost:5432/finrisk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Research artifact provenance verifies the recorded historical source commit.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install pip==26.2.0
      - run: python -m pip install -c requirements.lock -e ".[dev,postgres,research]"
      - run: python -m pip check
      - run: python -m pip install pip-audit
      # Auditing the installed environment would always fail here: this project's
      # own editable install is not on PyPI, so pip-audit marks it unauditable and
      # `--strict` turns any such skip into a fatal error. requirements.lock is a
      # complete resolution, so audit it directly instead.
      - run: pip-audit --strict --no-deps -r requirements.lock
      # `research` holds the study modules, verifiers and harness. They are Python that
      # can silently invalidate a frozen manifest if they drift, so they are linted and
      # typed like any other source directory.
      - run: ruff check backend tests scripts research
      - name: Reject whitespace errors across the complete pushed/PR change
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base='HEAD^'
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          git diff --check "${base}..HEAD"
      - run: python scripts/validate_postgres_migration.py
      - run: pytest --cov=finrisk --cov-report=term-missing --cov-fail-under=90
      - name: Verify prospective empirical provenance fails closed
        run: python scripts/run_empirical_validation.py --provenance-v2 --report .runtime/integrity-report.json
      - name: Verify frozen E4 public research artifacts
        run: python scripts/verify_e4_public_artifacts.py
      - name: Verify current development and historical research artifacts (no retraining)
        # The fitted research artifact pins Python 3.12 and its numeric stack.
        # Both interpreters still run the full product/research test suite above,
        # including fail-closed tests for an incompatible replay runtime.
        if: matrix.python-version == '3.12'
        run: python -m scripts.verify_v042 --ci
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-strong-password-v041
      FINRISK_LLM_PROVIDER: mock
      FINRISK_BOOTSTRAP_TOKEN: ci-only-bootstrap-token-v041
      # Runtime verifiers reuse bounded HTTP helpers and the full PostgreSQL suite.
      PYTHONPATH: backend
      TRIVY_IMAGE_SRC: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: "3.12"}
      - name: Install locked runtime verification dependencies
        run: python -m pip install -c requirements.lock -e ".[dev,postgres]"
      - name: Verify both Compose stacks against the same built candidates
        # Reuses every previous HTTP/upload/restart/timeout check and also exercises
        # release Compose, migration idempotence and PostgreSQL corruption rejection.
        # No registry write, tag, attestation or publication is performed here.
        run: |
          python - <<'PYCODE'
          import json, os, sys
          from scripts import verify_v041_release as gate
          gate.STAGE = gate.ROOT / ".runtime/v042-container-ci"
          gate.PROJECT_NAME = "finrisk-v042-container-ci"
          gate.STAGE.mkdir(parents=True, exist_ok=True)
          gate.container_gate("docker", sys.executable, "0.4.2", [
              "--build-arg", f"OCI_REVISION={os.environ['GITHUB_SHA']}",
              "--build-arg", "OCI_VERSION=0.4.2",
          ])
          identities = json.loads((gate.STAGE / "candidate-image-ids.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for service, identity in identities.items():
                  output.write(f"VERIFIED_{service.upper()}_IMAGE_ID={identity}\n")
          PYCODE
      - name: Scan the exact tested API candidate (fixable vulnerabilities and secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.VERIFIED_API_IMAGE_ID }}
          format: json
          output: .runtime/v042-container-ci/trivy-api-fixable.json
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Scan the exact tested web candidate (fixable vulnerabilities and secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.VERIFIED_WEB_IMAGE_ID }}
          format: json
          output: .runtime/v042-container-ci/trivy-web-fixable.json
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Record unfiltered API and web vulnerability inventories
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.VERIFIED_API_IMAGE_ID }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: json
          output: .runtime/v042-container-ci/trivy-api-unfiltered.json
          exit-code: "0"
      - name: Record unfiltered web vulnerability inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.VERIFIED_WEB_IMAGE_ID }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: json
          output: .runtime/v042-container-ci/trivy-web-unfiltered.json
          exit-code: "0"
      - name: Verify reports bind the tested image identities
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from scripts.verify_trivy_report import assert_report_shape
          for service in ("api", "web"):
              expected = os.environ[f"VERIFIED_{service.upper()}_IMAGE_ID"]
              for kind in ("fixable", "unfiltered"):
                  path = Path(f".runtime/v042-container-ci/trivy-{service}-{kind}.json")
                  report = json.loads(path.read_text())
                  assert_report_shape(report)
                  if report["Metadata"]["ImageID"] != expected:
                      raise SystemExit(f"{path} does not describe the tested image")
                  findings = [v for r in report.get("Results", []) for v in r.get("Vulnerabilities", [])]
                  secrets = [v for r in report.get("Results", []) for v in r.get("Secrets", [])]
                  ids = sorted({v["VulnerabilityID"] for v in findings})
                  print(f"{service} {kind}: tested={expected}, findings={len(findings)}, secrets={len(secrets)}")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                      output.write(f"### {service} {kind} scan\n\n")
                      output.write(f"Tested local image ID: `{expected}` (not a registry digest).\n\n")
                      output.write(f"Vulnerabilities: **{len(findings)}**; secrets: **{len(secrets)}**.\n\n")
                      output.write("Advisories: " + (", ".join(ids) or "none") + "\n\n")
          PYCODE
      - name: Retain runtime and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: v042-container-verification
          path: .runtime/v042-container-ci
          include-hidden-files: true
          if-no-files-found: error
      - name: Stop disposable verification stacks
        if: always()
        env:
          CANDIDATE_API_IMAGE: finrisk-v0.4.2-gate-api:candidate
          CANDIDATE_WEB_IMAGE: finrisk-v0.4.2-gate-web:candidate
        run: |
          python - <<'PYCODE'
          import subprocess
          from scripts import verify_v041_release as gate
          gate.PROJECT_NAME = "finrisk-v042-container-ci"
          status = 0
          for files in (["docker-compose.release.yml"], [
              "docker-compose.yml", "docker-compose.prod.yml", "docker-compose.candidate.yml",
          ]):
              status |= subprocess.run(gate.compose("docker", files, "down", "-v"), check=False).returncode
          raise SystemExit(status)
          PYCODE
