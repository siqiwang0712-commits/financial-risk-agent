name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finrisk_test
          POSTGRES_USER: finrisk
          POSTGRES_PASSWORD: finrisk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finrisk -d finrisk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://finrisk:finrisk_test@localhost:5432/finrisk_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install -e ".[dev,postgres]"
      - run: ruff check backend tests scripts
      - run: python scripts/validate_postgres_migration.py
      - run: pytest --cov=finrisk --cov-report=term-missing --cov-fail-under=90
      - name: Verify empirical benchmark fails closed without unreviewed data
        run: python scripts/run_empirical_validation.py --allow-not-available
      - name: Reproduce v0.3.1 pilot without rewriting frozen v0.3.0 results
        run: |
          python scripts/replay_frozen_experiment.py v0.3.1-E1-diagnostic
          python scripts/replay_frozen_experiment.py v0.3.1-E2
          python scripts/replay_frozen_experiment.py v0.3.1-E3
          python scripts/run_v031_replay.py
          git diff --exit-code -- research/results/public_v1 research/results/v0.3.1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
