name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finrisk_test
          POSTGRES_USER: finrisk
          POSTGRES_PASSWORD: finrisk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finrisk -d finrisk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://finrisk:finrisk_test@localhost:5432/finrisk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install pip==26.2.0
      - run: python -m pip install -c requirements.lock -e ".[dev,postgres]"
      - run: python -m pip check
      - run: python -m pip install pip-audit
      # Auditing the installed environment would always fail here: this project's
      # own editable install is not on PyPI, so pip-audit marks it unauditable and
      # `--strict` turns any such skip into a fatal error. requirements.lock is a
      # complete resolution, so audit it directly instead.
      - run: pip-audit --strict --no-deps -r requirements.lock
      # `research` holds the study modules, verifiers and harness. They are Python that
      # can silently invalidate a frozen manifest if they drift, so they are linted and
      # typed like any other source directory.
      - run: ruff check backend tests scripts research
      - run: git diff --check HEAD^ HEAD
      - run: python scripts/validate_postgres_migration.py
      - run: pytest --cov=finrisk --cov-report=term-missing --cov-fail-under=90
      - name: Verify prospective empirical provenance fails closed
        run: python scripts/run_empirical_validation.py --provenance-v2 --report .runtime/integrity-report.json
      - name: Verify v0.3.4 E4 public research artifacts
        run: python scripts/verify_e4_public_artifacts.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-strong-password-v032
      FINRISK_LLM_PROVIDER: mock
      FINRISK_BOOTSTRAP_TOKEN: ci-only-bootstrap-token-v032
      # Smoke clients reuse the repository's bounded HTTP helpers without
      # installing the application package on the GitHub runner.
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile -t finrisk-frontend:ci frontend
      - name: Build and start production PostgreSQL/API stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d postgres migrate api web
      - name: Verify deployed HTTP contracts (auth, limits, correlation id)
        run: python scripts/verify_docker_health.py
      # The step above used to be named "... and PostgreSQL repository selection",
      # but it never touched a database: a wrong DATABASE_URL degraded the API to the
      # in-memory repository and every check still passed. These two steps assert the
      # datastore the process actually selected, then restart the API and prove the
      # tenant, credential and entity survived.
      - name: Assert the API selected PostgreSQL
        run: python scripts/verify_postgres_state.py --phase before --state-file .runtime/pg-state.json
      - name: Restart the API and assert persistence
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml restart api
          python scripts/verify_postgres_state.py --phase after --state-file .runtime/pg-state.json
      - name: Verify production timeout and explicit retry contract
        run: |
          FINRISK_ANALYSIS_TIMEOUT_SECONDS=0.001 docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate api web
          python scripts/verify_docker_timeout.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs postgres migrate api web
      - name: Stop smoke-test stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
