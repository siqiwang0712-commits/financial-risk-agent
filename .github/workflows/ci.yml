name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finrisk_test
          POSTGRES_USER: finrisk
          POSTGRES_PASSWORD: finrisk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finrisk -d finrisk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://finrisk:finrisk_test@localhost:5432/finrisk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install pip==25.2
      - run: python -m pip install -c requirements.lock -e ".[dev,postgres]"
      - run: python -m pip check
      - run: ruff check backend tests scripts
      - run: git diff --check HEAD^ HEAD
      - run: python scripts/validate_postgres_migration.py
      - run: pytest --cov=finrisk --cov-report=term-missing --cov-fail-under=90
      - name: Verify prospective empirical provenance fails closed
        run: python scripts/run_empirical_validation.py --provenance-v2 --report .runtime/integrity-report.json
      - name: Verify frozen v0.3.1 artifacts without regeneration
        run: |
          python scripts/replay_frozen_experiment.py v0.3.1-E1-diagnostic
          python scripts/replay_frozen_experiment.py v0.3.1-E2
          python scripts/replay_frozen_experiment.py v0.3.1-E3
          git diff --exit-code -- research/results/public_v1 research/results/v0.3.1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-strong-password-v032
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile -t finrisk-frontend:ci frontend
      - name: Build and start production PostgreSQL/API stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d postgres migrate api
      - name: Verify readiness and PostgreSQL repository selection
        run: python scripts/verify_docker_health.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs postgres migrate api
      - name: Stop smoke-test stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
