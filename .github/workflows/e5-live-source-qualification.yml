name: E5 live index-accession input qualification
on:
  workflow_dispatch:
  push:
    branches: [E5-experiment]
    paths: ['.github/workflows/e5-live-source-qualification.yml']
permissions:
  contents: read
jobs:
  qualify-live-source:
    if: github.ref == 'refs/heads/E5-experiment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock -e '.[research]'
      - name: Compare exact original accession facts and timestamps with the pinned official archive
        env:
          E5_LIVE_CACHE: ${{ runner.temp }}/live-source-cache
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, zlib
          from datetime import datetime
          from research.e5.execution.core import file_hash, read_json
          from research.e5.phase2.live_source import extract
          root = pathlib.Path.cwd()
          old = read_json(root/'research/e5/phase2/qualification/known-historical-source-path-avnet-v2.json')
          try:
              actual = extract(root, old['company'], old['accession'], pathlib.Path(os.environ['E5_LIVE_CACHE']))
              expected = old['bundle']['packet']
              differences = {k: {'archive': v, 'live': actual['packet']['features'][k]} for k, v in expected['features'].items()
                             if actual['packet']['features'][k] != v}
              seconds = (datetime.fromisoformat(expected['prediction_cutoff'])-datetime.fromisoformat(actual['packet']['prediction_cutoff'])).total_seconds()
              same_time = 0 <= seconds < 60
              result = {'status': 'PASSED' if not differences and same_time else 'FAILED',
                        'scope': 'EXCLUDED_HISTORICAL_SOURCE_QUALIFICATION_NOT_E5_EVIDENCE', 'bundle': actual,
                        'feature_differences': differences, 'archive_minute_ceiling_matches_primary_seconds': same_time, 'archive_minus_primary_seconds': seconds,
                        'clock_rule': 'ORIGINAL_EDGAR_INDEX_EASTERN_TO_UTC_SECOND_RESOLUTION; API_TIMESTAMP_IS_NOT_CLOCK_AUTHORITY',
                        'archive_acceptance': expected['prediction_cutoff'], 'source_sha256': file_hash(root/'research/e5/phase2/live_source.py'),
                        'E5_predictions_generated': 0, 'E5_outcomes_accessed': False}
          except Exception as exc:
              result = {'status': 'FAILED', 'error_type': type(exc).__name__, 'error': str(exc),
                        'source_sha256': file_hash(root/'research/e5/phase2/live_source.py'), 'E5_outcomes_accessed': False}
          print('E5_LIVE_SOURCE_QUALIFICATION '+base64.b64encode(zlib.compress(json.dumps(result,sort_keys=True).encode())).decode())
          if result['status'] != 'PASSED': raise SystemExit(2)
          PY
