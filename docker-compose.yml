services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finrisk
      POSTGRES_USER: finrisk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrisk -d finrisk"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["finrisk-postgres:/var/lib/postgresql/data"]
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    ports: ["8000:8000"]
    environment:
      FINRISK_LLM_PROVIDER: mock
      DATABASE_URL: postgresql://finrisk:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/finrisk
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: {context: frontend}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  finrisk-postgres:
